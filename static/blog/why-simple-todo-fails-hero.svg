<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <rect width="800" height="400" rx="12" fill="#faf8f3"/>
  <rect x="0.5" y="0.5" width="799" height="399" rx="11.5" stroke="#dfdcd2"/>

  <text x="40" y="40" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#6b6962">FIGURE · A LIST WITHOUT CONTEXT</text>

  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#c96442">vs.</text>

  <!-- LEFT: bare todo list, drowning -->
  <g transform="translate(60, 70)">
    <text x="0" y="14" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="1.6" fill="#6b6962">A SIMPLE LIST · YEAR ONE</text>

    <rect x="0" y="26" width="280" height="280" rx="6" fill="#ffffff" stroke="#dfdcd2"/>

    <g transform="translate(20, 50)" font-family="Inter, system-ui, sans-serif" font-size="11">
      <text y="0" fill="#1d1c19">○ Email Marta</text>
      <text y="20" fill="#1d1c19">○ Renew domain</text>
      <text y="40" fill="#6b6962">○ Look at flights</text>
      <text y="60" fill="#6b6962">○ Reply to Ben</text>
      <text y="80" fill="#6b6962">○ Buy birthday card</text>
      <text y="100" fill="#a8a59c">○ Tax thing</text>
      <text y="120" fill="#a8a59c">○ Schedule oil change</text>
      <text y="140" fill="#a8a59c">○ Call dentist</text>
      <text y="160" fill="#a8a59c">○ Read that paper</text>
      <text y="180" fill="#a8a59c">○ Update LinkedIn</text>
      <text y="200" fill="#a8a59c">○ Fix the squeaky door</text>
      <text y="220" fill="#a8a59c">○ … 142 more</text>
    </g>

    <!-- Big slash to suggest "doesn't work" -->
    <line x1="20" y1="290" x2="260" y2="46" stroke="#c96442" stroke-width="2" stroke-linecap="round" opacity="0.18"/>

    <!-- Footer caption -->
    <text x="0" y="324" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#c96442">No when. No why. No follow-up.</text>
  </g>

  <!-- RIGHT: a task with context -->
  <g transform="translate(450, 70)">
    <text x="0" y="14" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="1.6" fill="#6b6962">THE SAME TASK, IN MyP0</text>

    <rect x="0" y="26" width="290" height="280" rx="6" fill="#ffffff" stroke="#dfdcd2"/>

    <!-- Task row, highlighted -->
    <g transform="translate(0, 56)">
      <rect width="290" height="44" fill="#f4e6dd"/>
      <rect width="2" height="44" fill="#c96442"/>
      <circle cx="22" cy="22" r="6" fill="none" stroke="#dfdcd2"/>
      <text x="40" y="26" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#1d1c19">Reply to Ben re: API keys</text>
      <rect x="200" y="13" width="48" height="18" rx="9" fill="#faf8f3" stroke="#dfdcd2"/>
      <text x="224" y="25" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6b6962">Inbox</text>
      <text x="262" y="26" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#c96442">● 1</text>
    </g>

    <!-- Date eyebrow above -->
    <text x="20" y="48" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#6b6962">@Wednesday, April 29</text>

    <!-- Anchored comment card -->
    <g transform="translate(20, 116)">
      <rect width="250" height="74" rx="8" fill="#faf8f3" stroke="#dfdcd2"/>
      <circle cx="20" cy="20" r="11" fill="#faf8f3" stroke="#dfdcd2"/>
      <text x="20" y="23" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="#1d1c19">BD</text>
      <text x="40" y="20" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1d1c19">Ben</text>
      <text x="76" y="20" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6b6962">08:14</text>
      <text x="40" y="38" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1d1c19">Keys are in 1pw under</text>
      <text x="40" y="54" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1d1c19">'p0/staging'.</text>
    </g>

    <!-- Schedule reference -->
    <g transform="translate(20, 208)">
      <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="10" letter-spacing="1.4" fill="#6b6962">SCHEDULE</text>
      <text x="0" y="22" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b6962">14:00</text>
      <text x="44" y="22" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#c96442">1:1 with Ben — bring keys</text>
    </g>

    <text x="0" y="324" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#c96442">A task is the conversation around it.</text>
  </g>
</svg>
