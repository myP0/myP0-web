<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <rect width="800" height="400" rx="12" fill="#f6f4ef"/>
  <rect x="0.5" y="0.5" width="799" height="399" rx="11.5" stroke="#dfdcd2"/>

  <!-- Eyebrow -->
  <text x="40" y="40" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#6b6962">FIGURE · ESSAY</text>

  <!-- Center: glass wall -->
  <line x1="400" y1="64" x2="400" y2="336" stroke="#dfdcd2" stroke-width="1" stroke-dasharray="4,6"/>
  <text x="400" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#c96442">walled garden</text>

  <!-- LEFT: AI assistant reaching -->
  <g transform="translate(80, 110)">
    <text x="120" y="0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#6b6962">THE ASSISTANT</text>

    <!-- Conversation bubble -->
    <rect x="0" y="22" width="240" height="120" rx="10" fill="#ffffff" stroke="#dfdcd2"/>
    <text x="20" y="50" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1d1c19">You</text>
    <text x="20" y="68" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6b6962">Plan my week from</text>
    <text x="20" y="84" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6b6962">my notes and calendar.</text>

    <text x="20" y="112" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#c96442">Assistant</text>
    <text x="20" y="130" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#1d1c19">I don't have access to that…</text>

    <!-- Arrow toward the wall, blocked by an X -->
    <line x1="246" y1="100" x2="288" y2="100" stroke="#c96442" stroke-width="1.5"/>
    <polyline points="282,94 288,100 282,106" stroke="#c96442" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="300" y1="92" x2="314" y2="108" stroke="#c96442" stroke-width="2" stroke-linecap="round"/>
    <line x1="314" y1="92" x2="300" y2="108" stroke="#c96442" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- RIGHT: scattered, locked data -->
  <g transform="translate(440, 110)">
    <text x="120" y="0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#6b6962">YOUR DATA, ELSEWHERE</text>

    <!-- 6 cards: each a category held inside a vendor's walled garden -->
    <g font-family="Inter, system-ui, sans-serif" fill="#1d1c19">
      <g transform="translate(0, 22)">
        <rect width="74" height="56" rx="6" fill="#ffffff" stroke="#dfdcd2"/>
        <text x="10" y="20" font-size="9" letter-spacing="1.4" fill="#6b6962">CALENDAR</text>
        <text x="10" y="36" font-size="11" font-weight="500">Google</text>
        <text x="10" y="50" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#c96442">walled</text>
      </g>
      <g transform="translate(82, 22)">
        <rect width="74" height="56" rx="6" fill="#ffffff" stroke="#dfdcd2"/>
        <text x="10" y="20" font-size="9" letter-spacing="1.4" fill="#6b6962">NOTES</text>
        <text x="10" y="36" font-size="11" font-weight="500">Notion</text>
        <text x="10" y="50" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#c96442">walled</text>
      </g>
      <g transform="translate(164, 22)">
        <rect width="76" height="56" rx="6" fill="#ffffff" stroke="#dfdcd2"/>
        <text x="10" y="20" font-size="9" letter-spacing="1.4" fill="#6b6962">TASKS</text>
        <text x="10" y="36" font-size="11" font-weight="500">Linear</text>
        <text x="10" y="50" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#c96442">walled</text>
      </g>
      <g transform="translate(0, 86)">
        <rect width="74" height="56" rx="6" fill="#ffffff" stroke="#dfdcd2"/>
        <text x="10" y="20" font-size="9" letter-spacing="1.4" fill="#6b6962">EMAIL</text>
        <text x="10" y="36" font-size="11" font-weight="500">Gmail</text>
        <text x="10" y="50" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#c96442">walled</text>
      </g>
      <g transform="translate(82, 86)">
        <rect width="74" height="56" rx="6" fill="#ffffff" stroke="#dfdcd2"/>
        <text x="10" y="20" font-size="9" letter-spacing="1.4" fill="#6b6962">CHAT</text>
        <text x="10" y="36" font-size="11" font-weight="500">Slack</text>
        <text x="10" y="50" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#c96442">walled</text>
      </g>
      <g transform="translate(164, 86)">
        <rect width="76" height="56" rx="6" fill="#ffffff" stroke="#dfdcd2"/>
        <text x="10" y="20" font-size="9" letter-spacing="1.4" fill="#6b6962">FILES</text>
        <text x="10" y="36" font-size="11" font-weight="500">iCloud</text>
        <text x="10" y="50" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#c96442">walled</text>
      </g>
    </g>
  </g>
</svg>
