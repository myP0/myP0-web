<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <rect width="800" height="400" rx="12" fill="#f6f4ef"/>
  <rect x="0.5" y="0.5" width="799" height="399" rx="11.5" stroke="#dfdcd2"/>

  <!-- Eyebrow -->
  <text x="40" y="40" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#6b6962">FIGURE · ESSAY</text>

  <!-- Center: glass wall -->
  <line x1="400" y1="64" x2="400" y2="336" stroke="#dfdcd2" stroke-width="1" stroke-dasharray="4,6"/>
  <text x="400" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#c96442">walled garden</text>

  <!-- LEFT: AI assistant reaching -->
  <g transform="translate(80, 110)">
    <text x="120" y="0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#6b6962">THE ASSISTANT</text>

    <!-- Conversation bubble -->
    <rect x="0" y="22" width="240" height="120" rx="10" fill="#ffffff" stroke="#dfdcd2"/>
    <text x="20" y="50" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1d1c19">You</text>
    <text x="20" y="68" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6b6962">Plan my week from</text>
    <text x="20" y="84" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6b6962">my notes and calendar.</text>

    <text x="20" y="112" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#c96442">Assistant</text>
    <text x="20" y="130" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#1d1c19">I don't have access to</text>

    <!-- Thwarted-arrow toward wall -->
    <line x1="240" y1="100" x2="298" y2="100" stroke="#c96442" stroke-width="1.5"/>
    <line x1="290" y1="92" x2="298" y2="100" stroke="#c96442" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="290" y1="108" x2="298" y2="100" stroke="#c96442" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="298" y1="80" x2="298" y2="120" stroke="#c96442" stroke-width="2" stroke-linecap="round"/>
    <line x1="290" y1="80" x2="306" y2="120" stroke="#c96442" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- RIGHT: scattered, locked data -->
  <g transform="translate(440, 110)">
    <text x="120" y="0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#6b6962">YOUR DATA, ELSEWHERE</text>

    <!-- 6 vendor cards in a 3x2 grid, each a small "walled" box -->
    <g font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1d1c19">
      <g transform="translate(0, 22)">
        <rect width="74" height="50" rx="6" fill="#ffffff" stroke="#dfdcd2"/>
        <text x="10" y="20" font-size="9" letter-spacing="1.4" fill="#6b6962">NOTION</text>
        <text x="10" y="38" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#c96442">walled</text>
      </g>
      <g transform="translate(82, 22)">
        <rect width="74" height="50" rx="6" fill="#ffffff" stroke="#dfdcd2"/>
        <text x="10" y="20" font-size="9" letter-spacing="1.4" fill="#6b6962">GMAIL</text>
        <text x="10" y="38" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#c96442">walled</text>
      </g>
      <g transform="translate(164, 22)">
        <rect width="76" height="50" rx="6" fill="#ffffff" stroke="#dfdcd2"/>
        <text x="10" y="20" font-size="9" letter-spacing="1.4" fill="#6b6962">LINEAR</text>
        <text x="10" y="38" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#c96442">walled</text>
      </g>
      <g transform="translate(0, 80)">
        <rect width="74" height="50" rx="6" fill="#ffffff" stroke="#dfdcd2"/>
        <text x="10" y="20" font-size="9" letter-spacing="1.4" fill="#6b6962">SLACK</text>
        <text x="10" y="38" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#c96442">walled</text>
      </g>
      <g transform="translate(82, 80)">
        <rect width="74" height="50" rx="6" fill="#ffffff" stroke="#dfdcd2"/>
        <text x="10" y="20" font-size="9" letter-spacing="1.4" fill="#6b6962">ICLOUD</text>
        <text x="10" y="38" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#c96442">walled</text>
      </g>
      <g transform="translate(164, 80)">
        <rect width="76" height="50" rx="6" fill="#ffffff" stroke="#dfdcd2"/>
        <text x="10" y="20" font-size="9" letter-spacing="1.4" fill="#6b6962">GOOGLE</text>
        <text x="10" y="38" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#c96442">walled</text>
      </g>
    </g>
  </g>
</svg>
