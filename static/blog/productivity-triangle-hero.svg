<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <rect width="800" height="400" rx="12" fill="#fdfbf6"/>
  <rect x="0.5" y="0.5" width="799" height="399" rx="11.5" stroke="#dfdcd2"/>

  <text x="40" y="40" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#6b6962">FIGURE · ONE FOLDER, THREE TOOLS</text>

  <!-- Triangle edges (three lines connecting the corner cards) -->
  <g stroke="#dfdcd2" stroke-width="1" stroke-dasharray="4,4">
    <line x1="220" y1="148" x2="580" y2="148"/>
    <line x1="220" y1="148" x2="400" y2="320"/>
    <line x1="580" y1="148" x2="400" y2="320"/>
  </g>

  <!-- Center: shared folder (where everything actually lives) -->
  <g transform="translate(345, 178)">
    <rect width="110" height="80" rx="6" fill="#ffffff" stroke="#c96442"/>
    <rect x="14" y="-6" width="42" height="14" rx="3" fill="#c96442"/>
    <text x="55" y="40" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#c96442">/MyP0</text>
    <text x="55" y="58" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" letter-spacing="1.4" fill="#6b6962">ONE FOLDER</text>
  </g>

  <!-- TOP-LEFT: Notes -->
  <g transform="translate(120, 96)">
    <rect width="200" height="104" rx="6" fill="#ffffff" stroke="#dfdcd2"/>
    <text x="20" y="28" font-family="Inter, system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#6b6962">I · NOTES</text>
    <text x="20" y="58" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#1d1c19">.md files</text>
    <text x="20" y="80" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b6962">Half-formed thoughts,</text>
    <text x="20" y="94" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b6962">verbatim.</text>
  </g>

  <!-- TOP-RIGHT: Calendar -->
  <g transform="translate(480, 96)">
    <rect width="200" height="104" rx="6" fill="#ffffff" stroke="#dfdcd2"/>
    <text x="20" y="28" font-family="Inter, system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#6b6962">II · CALENDAR</text>
    <text x="20" y="58" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#1d1c19">.ics events</text>
    <text x="20" y="80" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b6962">The shape of the</text>
    <text x="20" y="94" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b6962">working week.</text>
  </g>

  <!-- BOTTOM: Tasks -->
  <g transform="translate(300, 268)">
    <rect width="200" height="104" rx="6" fill="#ffffff" stroke="#dfdcd2"/>
    <text x="20" y="28" font-family="Inter, system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#6b6962">III · TASKS</text>
    <text x="20" y="58" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#1d1c19">lines in a file</text>
    <text x="20" y="80" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b6962">What you said you'd</text>
    <text x="20" y="94" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b6962">do, and when.</text>
  </g>
</svg>
