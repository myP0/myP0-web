<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <rect width="800" height="400" rx="12" fill="#f6f4ef"/>
  <rect x="0.5" y="0.5" width="799" height="399" rx="11.5" stroke="#dfdcd2"/>

  <text x="40" y="40" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#6b6962">FIGURE · MONTHLY BILL</text>

  <!-- Center separator: total -->
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#c96442">vs.</text>

  <!-- LEFT: stack of subscription receipts -->
  <g transform="translate(60, 70)">
    <text x="0" y="14" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="1.6" fill="#6b6962">YOUR CURRENT STACK</text>

    <!-- Receipts, slightly rotated -->
    <g font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1d1c19">
      <g transform="translate(0, 30) rotate(-2)">
        <rect width="290" height="40" rx="4" fill="#ffffff" stroke="#dfdcd2"/>
        <text x="14" y="24" font-weight="500">Notion</text>
        <text x="276" y="24" text-anchor="end" font-family="Georgia, serif" font-style="italic">$10 / mo</text>
      </g>
      <g transform="translate(8, 76) rotate(1)">
        <rect width="290" height="40" rx="4" fill="#ffffff" stroke="#dfdcd2"/>
        <text x="14" y="24" font-weight="500">Todoist Pro</text>
        <text x="276" y="24" text-anchor="end" font-family="Georgia, serif" font-style="italic">$5 / mo</text>
      </g>
      <g transform="translate(-4, 122) rotate(-1.2)">
        <rect width="290" height="40" rx="4" fill="#ffffff" stroke="#dfdcd2"/>
        <text x="14" y="24" font-weight="500">Fantastical</text>
        <text x="276" y="24" text-anchor="end" font-family="Georgia, serif" font-style="italic">$5 / mo</text>
      </g>
      <g transform="translate(6, 168) rotate(0.8)">
        <rect width="290" height="40" rx="4" fill="#ffffff" stroke="#dfdcd2"/>
        <text x="14" y="24" font-weight="500">Readwise</text>
        <text x="276" y="24" text-anchor="end" font-family="Georgia, serif" font-style="italic">$8 / mo</text>
      </g>
      <g transform="translate(0, 214) rotate(-0.6)">
        <rect width="290" height="40" rx="4" fill="#ffffff" stroke="#dfdcd2"/>
        <text x="14" y="24" font-weight="500">iCloud+</text>
        <text x="276" y="24" text-anchor="end" font-family="Georgia, serif" font-style="italic">$3 / mo</text>
      </g>
    </g>

    <!-- Total badge -->
    <g transform="translate(0, 270)">
      <rect width="290" height="32" rx="16" fill="#1d1c19"/>
      <text x="14" y="20" font-family="Inter, system-ui, sans-serif" font-size="11" letter-spacing="1.6" fill="#f6f4ef">YEAR ONE</text>
      <text x="276" y="22" text-anchor="end" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#c96442">$372</text>
    </g>
  </g>

  <!-- RIGHT: single open folder -->
  <g transform="translate(450, 70)">
    <text x="0" y="14" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="1.6" fill="#6b6962">WHAT YOU PAY FOR myP0</text>

    <g transform="translate(0, 30)">
      <rect width="290" height="232" rx="6" fill="#ffffff" stroke="#dfdcd2"/>

      <text x="145" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="92" font-style="italic" fill="#c96442">$0</text>

      <line x1="40" y1="116" x2="250" y2="116" stroke="#dfdcd2"/>

      <text x="145" y="148" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1d1c19">No subscription.</text>
      <text x="145" y="170" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6b6962">Open source. Your Drive.</text>

      <!-- bullet rows -->
      <g transform="translate(40, 192)" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1d1c19">
        <text x="0" y="0"><tspan fill="#c96442">— </tspan>Calendar</text>
        <text x="74" y="0"><tspan fill="#c96442">— </tspan>Notes</text>
        <text x="138" y="0"><tspan fill="#c96442">— </tspan>Tasks</text>
      </g>
    </g>

    <g transform="translate(0, 270)">
      <rect width="290" height="32" rx="16" fill="#c96442"/>
      <text x="14" y="20" font-family="Inter, system-ui, sans-serif" font-size="11" letter-spacing="1.6" fill="#ffffff">YEAR ONE</text>
      <text x="276" y="22" text-anchor="end" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#ffffff">$0</text>
    </g>
  </g>
</svg>
