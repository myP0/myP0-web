<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <rect width="800" height="400" rx="12" fill="#faf8f3"/>
  <rect x="0.5" y="0.5" width="799" height="399" rx="11.5" stroke="#dfdcd2"/>

  <text x="40" y="40" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#6b6962">FIGURE · NO INTERNET</text>

  <!-- Top wifi-off badge -->
  <g transform="translate(330, 24)">
    <rect width="140" height="24" rx="12" fill="#1d1c19"/>
    <text x="40" y="16" font-family="Inter, system-ui, sans-serif" font-size="11" letter-spacing="1.4" fill="#faf8f3">OFFLINE</text>
    <g transform="translate(20, 6)" stroke="#c96442" stroke-width="1.4" stroke-linecap="round" fill="none">
      <path d="M2,7 a8,6 0 0 1 12,0"/>
      <path d="M5,10 a4,3 0 0 1 6,0"/>
      <circle cx="8" cy="13" r="1.2" fill="#c96442"/>
      <line x1="2" y1="13" x2="14" y2="2"/>
    </g>
  </g>

  <!-- Center divider -->
  <line x1="400" y1="80" x2="400" y2="368" stroke="#dfdcd2" stroke-dasharray="4,6"/>

  <!-- LEFT: Server-first, broken -->
  <g transform="translate(60, 96)">
    <text x="140" y="0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#6b6962">SERVER-FIRST</text>

    <!-- Phone -->
    <rect x="80" y="20" width="120" height="220" rx="14" fill="#1d1c19"/>
    <rect x="86" y="40" width="108" height="174" rx="3" fill="#faf8f3"/>

    <!-- Sad screen content -->
    <g transform="translate(94, 92)">
      <circle cx="46" cy="20" r="22" fill="none" stroke="#c96442" stroke-width="1.5"/>
      <line x1="36" y1="10" x2="56" y2="30" stroke="#c96442" stroke-width="2" stroke-linecap="round"/>
      <line x1="56" y1="10" x2="36" y2="30" stroke="#c96442" stroke-width="2" stroke-linecap="round"/>
      <text x="46" y="62" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="500" fill="#1d1c19">Can't reach server</text>
      <text x="46" y="78" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#6b6962">No data on device</text>
    </g>

    <!-- Status row -->
    <g transform="translate(20, 256)">
      <rect width="240" height="26" rx="13" fill="#ffffff" stroke="#dfdcd2"/>
      <circle cx="14" cy="13" r="4" fill="#c96442"/>
      <text x="26" y="17" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1d1c19">
        Your tasks are on <tspan font-family="Georgia, serif" font-style="italic" fill="#c96442">their</tspan> server
      </text>
    </g>
  </g>

  <!-- RIGHT: Offline-first, working -->
  <g transform="translate(440, 96)">
    <text x="140" y="0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#6b6962">OFFLINE-FIRST</text>

    <!-- Phone -->
    <rect x="80" y="20" width="120" height="220" rx="14" fill="#1d1c19"/>
    <rect x="86" y="40" width="108" height="174" rx="3" fill="#ffffff"/>

    <!-- Working list -->
    <g transform="translate(96, 60)">
      <text x="0" y="10" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#1d1c19">Today</text>
      <text x="84" y="10" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#6b6962">3 of 5</text>
      <line x1="0" y1="18" x2="84" y2="18" stroke="#dfdcd2"/>

      <g font-family="Inter, system-ui, sans-serif" font-size="9" fill="#1d1c19">
        <g transform="translate(0, 32)">
          <circle cx="6" cy="6" r="5" fill="#c96442"/>
          <text x="20" y="10" fill="#6b6962" text-decoration="line-through">Reply to Ben</text>
        </g>
        <g transform="translate(0, 52)">
          <circle cx="6" cy="6" r="5" fill="#c96442"/>
          <text x="20" y="10" fill="#6b6962" text-decoration="line-through">Audit Drive</text>
        </g>
        <g transform="translate(0, 72)">
          <circle cx="6" cy="6" r="5" fill="#c96442"/>
          <text x="20" y="10" fill="#6b6962" text-decoration="line-through">Outline Q2</text>
        </g>
        <g transform="translate(0, 92)">
          <circle cx="6" cy="6" r="5" fill="none" stroke="#dfdcd2"/>
          <text x="20" y="10">Ship the RFC</text>
        </g>
        <g transform="translate(0, 112)">
          <circle cx="6" cy="6" r="5" fill="none" stroke="#dfdcd2"/>
          <text x="20" y="10">Read 0421 memo</text>
        </g>
      </g>
    </g>

    <!-- Status row -->
    <g transform="translate(20, 256)">
      <rect width="240" height="26" rx="13" fill="#ffffff" stroke="#c96442"/>
      <circle cx="14" cy="13" r="4" fill="#c96442"/>
      <text x="26" y="17" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1d1c19">
        Your tasks are on <tspan font-family="Georgia, serif" font-style="italic" fill="#c96442">your</tspan> device
      </text>
    </g>
  </g>
</svg>
